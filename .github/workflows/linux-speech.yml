name: Linux speech and workspace

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/linux-speech.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Real local synthesis only. Physical Sonos tests remain opt-in.
      FSONOS_TEST_ESPEAK_NG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the local speech engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak-ng
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Check every target
        id: check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings
      - name: MCP tool input boundary regressions
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo test --locked -p fastmcp-protocol --lib tool_input_limit
      - name: Regression, simulator, and real Linux speech tests
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo test --locked --workspace --no-fail-fast
