name: Linux speech and workspace

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "scripts/test-remote-queue.cjs"
      - "scripts/test-remote-play-mode.cjs"
      - "scripts/test-remote-equalizer.cjs"
      - "scripts/test-remote-source-player.cjs"
      - "scripts/test-remote-fades.cjs"
      - "scripts/test-remote-library.cjs"
      - "scripts/test-remote-library-browse.cjs"
      - "scripts/test-remote-library-sync.cjs"
      - "scripts/test-remote-spotify-connect.cjs"
      - "scripts/test-remote-groups.cjs"
      - "scripts/test-remote-transfers.cjs"
      - "scripts/test-remote-live.cjs"
      - "scripts/test-remote-invalidation.cjs"
      - "scripts/test-remote-state.cjs"
      - "scripts/test-remote-playback.cjs"
      - "scripts/test-remote-transport.cjs"
      - "scripts/test-remote-volume.cjs"
      - "scripts/test-remote-announcements.cjs"
      - "scripts/test-remote-dj-preferences.cjs"
      - "scripts/test-remote-dj-session.cjs"
      - "scripts/test-remote-schedules.cjs"
      - "scripts/test-remote-scenes.cjs"
      - "scripts/test-remote-dj-steering.cjs"
      - "scripts/test-remote-history.cjs"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/linux-speech.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A started run always finishes: GitHub keeps one pending run behind it,
  # so the newest commit is tested next. Cancelling in progress left about
  # two of every three runs on main without a verdict (2026-10-14).
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Real local synthesis only. Physical Sonos tests remain opt-in.
      FSONOS_TEST_ESPEAK_NG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the local test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak-ng nodejs
      - name: Web queue client regressions
        run: node --test scripts/test-remote-queue.cjs scripts/test-remote-play-mode.cjs
      - name: Web direct source playback regressions
        run: node --test scripts/test-remote-source-player.cjs
      - name: Web speaker sound regressions
        run: node --test scripts/test-remote-equalizer.cjs scripts/test-remote-fades.cjs
      - name: Web library client regressions
        run: node --test scripts/test-remote-library.cjs scripts/test-remote-library-browse.cjs scripts/test-remote-library-sync.cjs scripts/test-remote-spotify-connect.cjs
      - name: Web room grouping regressions
        run: node --test scripts/test-remote-groups.cjs scripts/test-remote-transfers.cjs
      - name: Live remote recovery regressions
        run: node --test scripts/test-remote-live.cjs scripts/test-remote-state.cjs scripts/test-remote-invalidation.cjs scripts/test-remote-playback.cjs
      - name: Web transport and volume regressions
        run: node --test scripts/test-remote-transport.cjs scripts/test-remote-volume.cjs
      - name: Web announcement regressions
        run: node --test scripts/test-remote-announcements.cjs
      - name: Web DJ taste regressions
        run: node --test scripts/test-remote-dj-preferences.cjs scripts/test-remote-dj-steering.cjs scripts/test-remote-dj-session.cjs
      - name: Web scheduled routine regressions
        run: node --test scripts/test-remote-schedules.cjs
      - name: Web scene regressions
        run: node --test scripts/test-remote-scenes.cjs
      - name: Web action history regressions
        run: node --test scripts/test-remote-history.cjs
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Check every target
        id: check
        # Keep compiler diagnostics available when an independent gate fails.
        if: ${{ !cancelled() }}
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings
      - name: MCP tool input boundary regressions
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo test --locked -p fastmcp-protocol --lib tool_input_limit
      - name: Regression, simulator, and real Linux speech tests
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo test --locked --workspace --no-fail-fast
