name: Transfer reviewed native MCP source objects

on:
  push:
    branches: [main]
    paths: [.github/workflows/native-mcp-source-transfer.yml]

permissions:
  contents: write

jobs:
  transfer:
    if: github.repository == 'Dicklesworthstone/frankensonos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Upload the exact reviewed source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          
          REPO = "Dicklesworthstone/frankensonos"
          API = "https://api.github.com/repos/" + REPO + "/git/blobs"
          RECIPE = "0504f7cff70daef87da17105b784ec954b71b296"
          EXPECTED = {
              "lib": ("26be073ccabcf833fdcd055d110483df36ddbc99",
                      "65a6bf4b765adc7df749aa049fe5f595897fef46"),
              "router": ("88fe7a4135c4ac6a47d07ba6fd240e562f891c62",
                         "2129978fb737f7b6551477a54b2d2d0e2cc1918a"),
          }
          
          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          
          def request(url, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "frankensonos-reviewed-source-transfer",
              })
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          
          def fetch(sha):
              result = request(API + "/" + sha)
              assert result["encoding"] == "base64"
              data = base64.b64decode(result["content"])
              assert blob_sha(data) == sha, "source object hash mismatch"
              return data
          
          def replace(source, item):
              assert source.count(item["old"]) == item.get("count", 1), "patch context changed"
              return source.replace(item["old"], item["new"])
          
          recipe = json.loads(fetch(RECIPE))
          for name, (base, expected) in EXPECTED.items():
              part = recipe[name]
              assert part["base_sha"] == base
              source = fetch(base).decode("utf-8")
              for item in part["transforms"]:
                  source = replace(source, item)
              modern = part.get("modern_transform")
              if modern:
                  assert source.count(modern["scope"]) == 1
                  prefix, scoped = source.split(modern["scope"], 1)
                  source = prefix + modern["scope"] + replace(scoped, modern)
              data = source.encode("utf-8")
              assert blob_sha(data) == expected, "reviewed output hash mismatch"
              result = request(API, {"encoding": "utf-8", "content": source})
              assert result["sha"] == expected, "uploaded object hash mismatch"
              print(json.dumps({"path": part["path"], "sha": expected, "bytes": len(data)}), flush=True)
          PY
