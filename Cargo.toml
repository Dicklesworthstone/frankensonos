[workspace]
resolver = "2"
members = [
    "crates/fsonos-types",
    "crates/fsonos-proto",
    "crates/fsonos-core",
    "crates/fsonos-spotify",
    "crates/fsonos-api",
    "crates/fsonos-mcp",
    "crates/fsonos-cli",
    "crates/fsonos-tailscale",
    "crates/fsonos-sim",
]
exclude = [
    "vendor/fastapi-http",
    "vendor/fastmcp-server",
    "vendor/fastmcp-transport",
    "vendor/fastmcp-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
repository = "https://github.com/Dicklesworthstone/frankensonos"
homepage = "https://github.com/Dicklesworthstone/frankensonos"
authors = ["Jeffrey Emanuel"]

[workspace.dependencies]
# ── Internal crates ────────────────────────────────────────────────────────
fsonos-types   = { path = "crates/fsonos-types" }
fsonos-proto   = { path = "crates/fsonos-proto" }
fsonos-core    = { path = "crates/fsonos-core" }
fsonos-spotify = { path = "crates/fsonos-spotify" }
fsonos-api     = { path = "crates/fsonos-api" }
fsonos-mcp     = { path = "crates/fsonos-mcp" }
fsonos-tailscale = { path = "crates/fsonos-tailscale" }
fsonos-sim     = { path = "crates/fsonos-sim" }

# ── Rock-solid registry deps (the green baseline) ──────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# `fsonos completions <shell>`: the static scripts (no unstable features).
clap_complete = "4.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
# Read-only XML DOM (pure Rust, forbid(unsafe), zero deps) for SOAP bodies,
# ZoneGroupState, DIDL-Lite and device descriptions.
roxmltree = "0.21"
# Hand-edited data-dir config (aliases.toml, policy.toml, moods.toml).
toml = "1"
tempfile = "3"
# Ctrl-C / SIGTERM for `fsonos sim` (safe flag API).
signal-hook = "0.4"
# getifaddrs: the interface-scan fallback for Tailscale detection.
if-addrs = "0.15"

# ── FRANKEN STACK (bead FND-DEPS; see AGENTS.md "Dependency Recipe") ───────
# Every franken crate below resolves to the ONE registry asupersync 0.5.0
# (fastmcp pins `=0.5.0`; fastapi and fsqlite 0.4.9 require `0.5.0`), so `Cx`
# is a single type across our code, the MCP server, the HTTP API and the store.
# `cargo tree -i asupersync` must show exactly one version. Never path/git-dep
# asupersync: the local checkout is 0.6 and would fork the type universe.
asupersync = { version = "0.5", features = ["tls-webpki-roots"] }
# Registry fsqlite 0.4.9 is the line am_baseline's mailbox database runs on,
# and it shares asupersync 0.5.0. (The frankensqlite git rev 2633b38 that
# am_baseline also patches in is fsqlite 0.3.18 on asupersync 0.4.10 — only
# its embedded beads engine uses it; it would put a second runtime in our graph.)
# Engine futures overflow a default thread stack: drive the raw `!Send`
# `Connection` on a large-stack thread, or use `async-api`'s `AsyncConnection`
# (a `Send` handle over fsqlite's own 32 MiB worker) — see
# crates/fsonos-core/tests/fsqlite_roundtrip.rs.
fsqlite = { version = "=0.4.9", features = ["async-api"] }
fastmcp = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "03b5274544048babf6b358874310038a9ee4f76a", package = "fastmcp-rust" }
# Required next to the facade: at this rev the `#[tool]` expansion names
# `::fastmcp_server::promote_legacy_tool_content` by absolute path.
fastmcp-server = { git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "03b5274544048babf6b358874310038a9ee4f76a" }
# Register routes with `App::builder().get(..)`, not the `#[get]` macros: their
# expansion emits `#[allow(unsafe_code)]` (a Linux `link_section` route
# registry), which cannot coexist with the workspace `forbid(unsafe_code)`.
fastapi = { git = "https://github.com/Dicklesworthstone/fastapi_rust", rev = "cb9d72926434e2ec3e08cced5eae7f7c13168c7d", package = "fastapi-rust", default-features = false }
# ─────────────────────────────────────────────────────────────────────────────

# Carry bounded transport and per-tool input-limit fixes for WAV uploads.
# These are exact pinned source copies with small patches; see vendor/README.md.
[patch."https://github.com/Dicklesworthstone/fastapi_rust"]
fastapi-http = { path = "vendor/fastapi-http" }

[patch."https://github.com/Dicklesworthstone/fastmcp_rust"]
fastmcp-server = { path = "vendor/fastmcp-server" }
fastmcp-transport = { path = "vendor/fastmcp-transport" }
fastmcp-protocol = { path = "vendor/fastmcp-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed during early development:
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# The nightly `assert_is_empty` lint rewrites `assert!(!v.is_empty())` into a
# less-readable `assert_ne!(v, [] as [T; 0])`; keep the readable assert form in
# tests (same stance as the sibling am_baseline project).
assert_is_empty = "allow"
# Protocol/product names (UPnP, RINCON, WiFi, FrankenSonos, ...) are prose here.
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "unwind"   # long-running daemon: a panicked worker must not abort the process
