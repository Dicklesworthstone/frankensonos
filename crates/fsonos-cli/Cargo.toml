[package]
name = "fsonos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FrankenSonos command-line tool and daemon entrypoint (binary: fsonos)."

[[bin]]
name = "fsonos"
path = "src/main.rs"

[dependencies]
fsonos-types = { workspace = true }
fsonos-proto = { workspace = true }
fsonos-core = { workspace = true }
fsonos-spotify = { workspace = true }
fsonos-api = { workspace = true }
fsonos-mcp = { workspace = true }
fsonos-tailscale = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# FRANKEN (FND-DEPS): the one asupersync runtime every surface runs under.
asupersync = { workspace = true }
# The daemon hosts the HTTP API on fastapi's TCP server.
fastapi = { workspace = true }
# `fsonos serve` and `fsonos sim` stop cleanly on SIGINT / SIGTERM.
signal-hook = { workspace = true }
# `fsonos sim` (feature `sim`, on by default).
fsonos-sim = { workspace = true, optional = true }

[features]
default = ["sim"]
# `fsonos sim`: virtual players on loopback. `--no-default-features` drops it.
sim = ["dep:fsonos-sim"]

[dev-dependencies]
# The e2e harness (tests/e2e) drives the binary against virtual players.
fsonos-sim = { workspace = true }

[lints]
workspace = true
