[package]
name = "fsonos-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sonos interoperability protocol layer: SSDP discovery, UPnP/SOAP control, GENA eventing, DIDL-Lite."

[dependencies]
fsonos-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
roxmltree = { workspace = true }
# Multi-homed discovery: enumerate LAN interfaces (if-addrs) and pin each
# multicast query socket's egress to one of them (socket2's
# set_multicast_if_v4).
if-addrs = { workspace = true }
socket2 = { workspace = true }

# FRANKEN (FND-DEPS): asupersync for UDP multicast (SSDP), the HTTP/1.1
# client (SOAP control) and HTTP server (GENA callback sink), plus TLS.
asupersync = { workspace = true }

