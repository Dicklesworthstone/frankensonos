[package]
name = "fsonos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FrankenSonos core: device inventory, zone topology, grouping, control orchestration, and the local state store."

[dependencies]
fsonos-types = { workspace = true }
fsonos-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }

# FRANKEN (FND-DEPS): fsqlite for the durable local store (device
# cache, music-library cache, play history, DJ state), asupersync for the
# reconciliation loop.
fsqlite = { workspace = true }
asupersync = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Kill a timed-out engine's process group through a safe API, including
# children launched by an owner-configured wrapper.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
fsonos-sim = { workspace = true }

[lints]
workspace = true
